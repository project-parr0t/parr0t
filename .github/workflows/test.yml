name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK test dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' requirements; do
            python -m pip install --disable-pip-version-check --requirement "$requirements"
          done < <(find . -type f \( -name 'requirements.txt' -o -name 'requirements-*.txt' -o -name '*-requirements.txt' \) -not -path './.git/*' -print0 | sort -z)
      - run: python scripts/check_repo_privacy.py
      - run: python -m unittest discover -s tests -t . -v
