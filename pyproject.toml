[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parr0t"
version = "0.1.0"
description = "Provider-neutral, fallback-routed game localization orchestration for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Parr0t contributors" }]
dependencies = []

[project.scripts]
game-l10n = "game_l10n.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_l10n = ["templates/*.bat", "templates/*.ps1"]
"game_l10n.unity" = ["resources/*.cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
