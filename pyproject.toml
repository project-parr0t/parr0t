[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-l10n-sdk"
version = "0.1.0"
description = "Provider-neutral, refusal-aware game localization orchestration SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Game L10n SDK contributors" }]
dependencies = []

[project.scripts]
game-l10n = "game_l10n.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
